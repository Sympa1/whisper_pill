[package]
name = "whisper_pill"
version = "0.1.0"
edition = "2024"
authors = ["whisper-pill contributors"]
license = "MIT"
description = "Minimalistisches, schwebendes Desktop-Diktier-Utility fuer Linux und Windows"

[dependencies]
# Modernes deklaratives GUI Framework (Slint)
slint = "1.18"

# Audio-Aufnahme
cpal = "0.15"

# System-Zwischenablage
arboard = "3.4"

# Thread-Kommunikation
crossbeam-channel = "0.5"

# Serialisierung & Konfiguration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Asynchrone Runtime & Streams
tokio = { version = "1.40", features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"

# Lokale Whisper Inferenz
whisper-rs = "0.16.0"

# Linux D-Bus fuer KGlobalAccel Shortcut (Super+Strg+P) und System-Tray (ksni)
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
zbus = { version = "4.4", default-features = false, features = ["tokio"] }

[build-dependencies]
slint-build = "1.18"
