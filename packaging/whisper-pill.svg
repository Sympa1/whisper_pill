<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Whisper Pill Anwendungs-Icon (Vektorgrafik fuer AppImage und Desktop-Integration) -->
  <defs>
    <!-- Hintergrund-Gradient fuer das App-Icon -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Pill-Kapsel-Farbverlauf -->
    <linearGradient id="pillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#121215" />
    </linearGradient>

    <!-- Kapsel-Kontur mit feinem Cyan-Glow -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Audio-Wellenform Farbverlauf -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Sanfter Schein / Schattenwurf -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Abgerundeter Icon-Hintergrund -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGradient)" stroke="#27272a" stroke-width="4" />

  <!-- Schwebende Haupt-Pille (Pill Capsule) -->
  <g filter="url(#glow)">
    <rect x="76" y="166" width="360" height="180" rx="90" fill="url(#pillGradient)" stroke="url(#borderGradient)" stroke-width="6" />
  </g>

  <!-- Roter REC-Aufnahme-Indikator (Glow) -->
  <circle cx="150" cy="256" r="16" fill="#ef4444" />
  <circle cx="150" cy="256" r="24" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.4" />

  <!-- Stilisierte Audio-Wellenformen (Visualisierung der Spracheingabe) -->
  <g fill="url(#waveGradient)">
    <rect x="210" y="234" width="10" height="44" rx="5" />
    <rect x="234" y="214" width="10" height="84" rx="5" />
    <rect x="258" y="196" width="10" height="120" rx="5" />
    <rect x="282" y="206" width="10" height="100" rx="5" />
    <rect x="306" y="222" width="10" height="68" rx="5" />
    <rect x="330" y="236" width="10" height="40" rx="5" />
  </g>

  <!-- Cyan-Akzent-Punkt (Bereit / Whisper-KI) -->
  <circle cx="376" cy="256" r="10" fill="#38bdf8" />
</svg>
